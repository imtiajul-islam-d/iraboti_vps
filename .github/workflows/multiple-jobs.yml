name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs: 
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22"
                cache: 'npm'

            - name: Install packages
              run: npm install

            # - name: Test application
            #   run: npm run test

            # - name: Run tests
            #   run: npm test
    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22"
                cache: 'npm'

            - name: Install packages
              run: npm install

            - name: build nextjs
              run: npm run build

            - name: Verify build output
              run: ls -la build # Confirm .next folder exists
      
            - name: Upload build artifact
              uses: actions/upload-artifact@v4.6.0
              with:
                name: nextjs-build
                path: built/
                
                # include-hidden-files: true
                # if-no-files-found: error # Fail if .next/ is not found
                # retention-days: 5 # Artifact stored for 5 days
            # - name: Test application
            #   run: npm run test

            # - name: Run tests
            #   run: npm test
    build-and-deploy:
        runs-on: self-hosted
        needs: build
        steps:  
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Receive the artifact
              uses: actions/download-artifact@v4
              with:
                name: nextjs-build
            
            - name: Show the artifact
              run: 
                ls -a


            # - name: Install dependencies
            #   run: npm install

            # - name: Build the app
            #   run: npm run build
            # - name: Build application
            #   run: |
            #     npm install
            #     npm run build
            #     # add any build steps if needed

            - name: Deploy application
              run: |
                ls -a
                pm2 status
                # stop existing process if running
                pm2 delete node-app || true

                # start new process
                pm2 start "npm start" --name=node-app

                # same PM2 process list
                pm2 save
                
